    <script>
      // Ember Day or Ember Night, following the device (the app's boot script without a stored preference).
      (function () {
        var m = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
        function apply() {
          var dark = !!(m && m.matches);
          document.documentElement.setAttribute("data-theme", dark ? "ember-night" : "ember-day");
          document.documentElement.classList.toggle("dark", dark);
        }
        apply();
        if (m && m.addEventListener) m.addEventListener("change", apply);
      })();
    </script>
